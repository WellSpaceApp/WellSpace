<!DOCTYPE html>
<html lang="en" data-theme="light" data-font-size="medium">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WellSpace</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Skip link for accessibility -->
  <a href="#main-content" id="skip-link" class="sr-only">Skip to main content</a>

  <header class="app-header">
    <button class="nav-toggle" aria-label="Toggle navigation">☰</button>
    <a href="#home" class="logo" data-view="home">WellSpace</a>
    <nav class="main-nav">
      <!-- These show/hide based on role via CSS if you want, or let the script handle it -->
      <a href="#student-dashboard" class="nav-link" data-view="student-dashboard">Dashboard</a>
      <a href="#checkin" class="nav-link" data-view="checkin">Check-In</a>
      <a href="#goals" class="nav-link" data-view="goals">Goals</a>
      <a href="#habits" class="nav-link" data-view="habits">Habits</a>
      <a href="#calendar" class="nav-link" data-view="calendar">Calendar</a>
      <a href="#analytics" class="nav-link" data-view="analytics">Analytics</a>
      <a href="#resources" class="nav-link" data-view="resources">Resources</a>
      <a href="#settings" class="nav-link" data-view="settings">Settings</a>
      <a href="#profile" class="nav-link" data-view="profile">Profile</a>
    </nav>
    <div class="header-actions">
      <button id="theme-toggle" class="btn-icon" aria-label="Switch theme">🌙</button>
    </div>
  </header>

  <main id="main-content">
    <!-- Views are auto-generated by script.js, but you CAN pre-define them if you want -->
  </main>

  <footer class="app-footer">
    <div class="footer-links">
      <a href="#about" data-view="about">About</a>
      <a href="#faq" data-view="faq">FAQ</a>
      <a href="#contact" data-view="contact">Contact</a>
      <a href="#privacy" data-view="privacy">Privacy</a>
      <a href="#roadmap" data-view="roadmap">Roadmap</a>
    </div>
    <p class="footer-copy">WellSpace v2.0.0 • Open Source • Built for Students</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
